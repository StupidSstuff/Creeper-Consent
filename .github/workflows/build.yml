name: Build Mod JARs

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Fabric and NeoForge JARs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build mod JARs
        run: ./gradlew build --no-daemon

      - name: Upload mod JARs
        uses: actions/upload-artifact@v4
        with:
          name: creeper-consent-mods-${{ github.sha }}
          path: Releases/*.jar
          if-no-files-found: error
          retention-days: 14
